[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threads-srmh"
version = "0.1.0"
description = "THREADS temporal historical relational reasoning engine"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["srmh"]